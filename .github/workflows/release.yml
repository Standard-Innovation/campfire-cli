name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository] -- actionlint does not accept the $/ syntax yet
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] -- actionlint does not accept the $/ syntax yet
    permissions:
      contents: read
      security-events: write

  release:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this job holds contents: write; never restore a shared cache into it

      # goreleaser-action verifies GoReleaser's signature only when cosign is on PATH.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0 # bumped by hand; Dependabot doesn't track action inputs
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
